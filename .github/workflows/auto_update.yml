name: Auto Update Lottery Data

on:
  schedule:
    # 順球時段
    - cron: '20 17 * * 1-6' # 台灣時間 01:20
    - cron: '40 12 * * 1-6' # 台灣時間 20:40
    # 落球時段
    - cron: '0 13 * * 1-6'  # 台灣時間 21:00
    - cron: '30 13 * * 1-6' # 台灣時間 21:30
    - cron: '0 14 * * 1-6'  # 台灣時間 22:00
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @octokit/rest

      - name: Run update script
        env:
          GH_PAT: ${{ secrets.GH_PAT }} # 帶入具備跨庫寫入權限的 Token
        run: node update.js
