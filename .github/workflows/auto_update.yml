name: Auto Update Lottery

on:
  schedule:
    - cron: '0 10 * * 1-6'   # 台灣時間 15:00 測試用
    - cron: '40 12 * * 1-6' # 台灣時間 20:35 正式開獎用
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install axios iconv-lite

      - name: Run update script
        run: node update.js

      - name: Commit and push if changed
        run: |
          git config --global user.name "Auto Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add vvv.js
          git commit -m "Auto-update vvv.js" || echo "沒有變更需要提交"
          git push
